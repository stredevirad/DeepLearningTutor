[pytest]
testpaths = tests
addopts = -ra
markers =
    slow: trains a (tiny) model or runs the whole Streamlit script; still CPU-friendly
filterwarnings =
    ignore::DeprecationWarning:keras.*
    ignore::DeprecationWarning:tensorflow.*
    ignore::DeprecationWarning:google.*
    ignore::DeprecationWarning:proto.*
    ignore::FutureWarning:google.*
